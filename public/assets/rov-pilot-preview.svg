  <circle cx="46" cy="158" r="4" fill="#6c8191"/><text x="61" y="163" fill="#bdced0" font-family="monospace" font-size="13">PAYLOAD</text><text x="235" y="163" text-anchor="end" fill="#8b9ca8" font-family="monospace" font-size="11">NO DATA</text>
  <rect x="24" y="195" width="236" height="104" rx="8" fill="#0b141d" stroke="#30424c"/>
  <text x="42" y="220" fill="#b5a1cb" font-family="monospace" font-size="12" letter-spacing="1">VEHICLE</text>
