<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ROV Pilot cockpit illustration</title>
  <desc id="desc">A conceptual topside cockpit with vehicle status, a central attitude display, camera panels and telemetry readouts.</desc>
  <defs>
    <radialGradient id="back"><stop stop-color="#10272b"/><stop offset=".7" stop-color="#071116"/><stop offset="1" stop-color="#05090f"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="720" rx="18" fill="url(#back)"/>
  <rect x="1" y="1" width="1198" height="718" rx="17" fill="none" stroke="#2b4048"/>
  <path d="M1 57h1198M1 670h1198" stroke="#26363e"/>
  <circle cx="27" cy="29" r="5" fill="#52d4bd"/>
