  <rect x="24" y="314" width="236" height="71" rx="8" fill="#0b141d" stroke="#30424c"/>
  <text x="42" y="340" fill="#b5a1cb" font-family="monospace" font-size="12" letter-spacing="1">SYSTEM HEALTH</text>
